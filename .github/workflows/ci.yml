name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: socud-backend
    env:
      # Dummy values for CI only: unit tests and build do not connect to a database.
      DATABASE_URL: postgresql://ci:ci-dummy-password@localhost:5432/ci_dummy_db
      JWT_SECRET: ci-dummy-jwt-secret-not-for-real-use-0123456789
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: socud-backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint:ci
      - run: npm run typecheck
      - run: npm test -- --ci
      - run: npm run build
      # The committed OpenAPI document must match the code (regenerate with `npm run openapi:export`).
      - name: OpenAPI document is up to date
        run: |
          npm run openapi:export
          git diff --exit-code -- openapi.json

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: socud-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: socud-frontend/package-lock.json

      - run: npm ci
      # Generated API types must match ../socud-backend/openapi.json (regenerate with `npm run api:gen`).
      - name: API types are up to date
        run: |
          npm run api:gen
          git diff --exit-code -- src/lib/api/
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Read Node version
        id: node
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Build backend image (runtime)
        uses: docker/build-push-action@v6
        with:
          context: socud-backend
          target: runtime
          push: false
          build-args: NODE_VERSION=${{ steps.node.outputs.version }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build backend image (migrate)
        uses: docker/build-push-action@v6
        with:
          context: socud-backend
          target: migrate
          push: false
          build-args: NODE_VERSION=${{ steps.node.outputs.version }}
          cache-from: type=gha,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: socud-frontend
          push: false
          build-args: NODE_VERSION=${{ steps.node.outputs.version }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Validate compose file
        run: POSTGRES_PASSWORD=ci-dummy docker compose --profile app config -q

      - name: dev.sh embedding-profile rules
        run: bash dev.test.sh

  ai-worker:
    name: AI worker (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: socud-ai-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # MLX is macOS/Apple Silicon only, so the model is never loaded in CI. Only requirements-dev.txt
      # (no mlx) is installed; tests that need mlx skip themselves via pytest.importorskip.
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q
