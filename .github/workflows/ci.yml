name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: socud-backend
    env:
      # Dummy values for CI only: unit tests and build do not connect to a database.
      DATABASE_URL: postgresql://ci:ci-dummy-password@localhost:5432/ci_dummy_db
      JWT_SECRET: ci-dummy-jwt-secret-not-for-real-use-0123456789
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: socud-backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint:ci
      - run: npm run typecheck
      - run: npm test -- --ci
      - run: npm run build

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: socud-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: socud-frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  ai-worker:
    name: AI worker (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: socud-ai-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # MLX is macOS/Apple Silicon only, so the model is never loaded in CI. Only requirements-dev.txt
      # (no mlx) is installed; tests that need mlx skip themselves via pytest.importorskip.
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q
